<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace de travail · Flowrent Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<style>
/* Mise en page : bandeau, puis rail des étapes à gauche et panneau de travail à droite ; une colonne sur mobile. */
:root {
  --bg: #f6f5fa;
  --surface: #ffffff;
  --ink: #1d1b2c;
  --muted: #625e78;
  --line: #e2dfec;
  --accent: #5b2bd6;
  --accent-ink: #ffffff;
  --accent-soft: #efeafd;
  --ok: #1d7a4a; --ok-soft: #e3f4ea;
  --warn: #9a5b00; --warn-soft: #fbf0dc;
  --info: #2457c5; --info-soft: #e6eefc;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14121c; --surface: #1d1a29; --ink: #ecebf4; --muted: #a29eb9; --line: #332f47;
    --accent: #a78bfa; --accent-ink: #14121c; --accent-soft: #2a2343;
    --ok: #6fd39d; --ok-soft: #173426; --warn: #f0b75a; --warn-soft: #3a2c12; --info: #8db0f5; --info-soft: #1a2640;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14121c; --surface: #1d1a29; --ink: #ecebf4; --muted: #a29eb9; --line: #332f47;
  --accent: #a78bfa; --accent-ink: #14121c; --accent-soft: #2a2343;
  --ok: #6fd39d; --ok-soft: #173426; --warn: #f0b75a; --warn-soft: #3a2c12; --info: #8db0f5; --info-soft: #1a2640;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { height: 30px; }
.brand .t { font-family: var(--font-display); font-weight: 700; }
.brand .s { font-size: .85rem; color: var(--muted); }
.spaces { display: flex; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
.spaces a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 7px; font-weight: 700; font-size: .92rem; }
.spaces a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.shell { display: grid; grid-template-columns: 250px 1fr; gap: 20px; max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
@media (max-width: 820px) { .shell { grid-template-columns: 1fr; } }
.rail { display: flex; flex-direction: column; gap: 4px; }
.rail button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: var(--ink); }
.rail button:hover { background: var(--accent-soft); }
.rail button[aria-current="true"] { background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(0,0,0,.04); font-weight: 700; }
.rail .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .78rem; font-weight: 700; background: var(--accent-soft); color: var(--accent); flex: none; }
.rail .lbl { flex: 1; }
.rail .cnt { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail .cnt.hot { background: var(--warn-soft); color: var(--warn); padding: 1px 7px; border-radius: 99px; font-weight: 700; }
.rail .sep { height: 1px; background: var(--line); margin: 8px 4px; }

.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.intro { color: var(--muted); max-width: 68ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
.guard { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 14px; border-radius: 8px; font-size: .92rem; }
.guard b { color: var(--warn); }

.btn { cursor: pointer; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 9px; font-weight: 700; font-size: .92rem; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 10px; font-size: .84rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.pill { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.st-a_ecrire { background: var(--info-soft); color: var(--info); }
.st-brouillon { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.st-a_relire { background: var(--accent-soft); color: var(--accent); }
.st-a_valider { background: var(--warn-soft); color: var(--warn); }
.st-validee { background: var(--ok-soft); color: var(--ok); }
.imp-1 { background: var(--warn-soft); color: var(--warn); }
.imp-2 { background: var(--info-soft); color: var(--info); }
.imp-3 { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.item .ttl { font-weight: 700; }
.item .meta { color: var(--muted); font-size: .88rem; }
.item .acts { display: flex; gap: 6px; align-items: start; flex-wrap: wrap; justify-content: flex-end; }
.empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; }
.group-h { font-family: var(--font-display); font-weight: 700; font-size: .95rem; color: var(--muted); margin-top: 6px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.tile .code { font-size: .76rem; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.tile .big { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: .85rem; color: var(--muted); }
.bar { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar span { display: block; height: 100%; background: var(--accent); }
.bar.warn span { background: var(--warn); }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }

/* Éditeur en surimpression */
.overlay { position: fixed; inset: 0; background: rgba(20,18,30,.45); display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; overflow-y: auto; z-index: 10; }
.sheet { background: var(--surface); border-radius: 14px; border: 1px solid var(--line); width: min(760px, 100%); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-weight: 700; }
.field .hint { font-size: .85rem; color: var(--muted); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; background: var(--bg); width: 100%; }
.field textarea { min-height: 96px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .two { grid-template-columns: 1fr; } }
.ro { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; white-space: pre-wrap; }
.notice { font-size: .9rem; padding: 8px 12px; border-radius: 8px; background: var(--info-soft); color: var(--info); }
.notice.err { background: var(--warn-soft); color: var(--warn); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-weight: 700; z-index: 20; }
.mic { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 10px; font-size: .82rem; cursor: pointer; }
.mic[data-on="1"] { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.hidden { display: none !important; }
.shell.solo { grid-template-columns: 1fr; max-width: 520px; }
.small { font-size: .85rem; color: var(--muted); }
#login-code { text-transform: uppercase; letter-spacing: .1em; font-size: 1.1rem; }
pre.md { white-space: pre-wrap; font-size: .82rem; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 12px; max-height: 420px; overflow: auto; }
</style>
</head>

<div id="layer"></div>

<script>
(() => {
"use strict";

/* ---------- Référentiels ---------- */
const DOMAINES = ["Achats et fournisseurs","Facturation clients et relances","Factures fournisseurs, banque et comptabilité","Trésorerie et règlements","Paie et pointage","Gestion du personnel","Suivi des affaires","Dossiers de financement","Communication interne et classement","Autre"];
const FREQ = ["Chaque jour","Chaque semaine","Chaque mois","Chaque trimestre","Chaque année","Quand ça arrive"];
const QUISAIT = ["Personne d'autre","Quelqu'un, en partie","Quelqu'un sait le faire"];
const IMP = {"1":"Essentiel","2":"Important","3":"Secondaire"};
const PARTIES = {poste_ad:"Mon poste", affaires:"Suivi d'une affaire, du devis à la clôture"};
const ETAPES = ["Devis","Commande et ouverture de l'affaire","Achats","Chantier et interventions","Facturation","Clôture et règlement"];
const ST = {a_ecrire:"À écrire", brouillon:"Brouillon", a_relire:"Envoyée à Florent", a_valider:"À relire et valider", validee:"Validée"};
const LIVRABLES = {B01:"Guide du poste d'assistante de direction", B03:"Procédures de gestion d'affaires", B04:"Livret d'accueil", B21:"Correspondance des nomenclatures", AUTRE:"Autre"};
const MAX_SITE = 6;
const COLS = ["activites","fiches","questions","accueil","documents","seances","nomenclature"];

/* ---------- Configuration ---------- */
const API = "https://flowrentbuild.app.n8n.cloud/webhook/espace-lot1";
const POLL_MS = 30000;
const STORE_KEY = "espace-lot1-code";

/* ---------- État ---------- */
const S = { code:null, owner:false, ready:false, client:"", ref:"", noms:{genevieve:"", florent:"Florent"}, data:{}, err:null, gSec:"accueil", fSec:"bord", dict:null };
const ALL = COLS.concat(["prive"]);
ALL.forEach(c => S.data[c] = []);

const $ = (sel, el=document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");
const nowIso = () => new Date().toISOString();
const fmtDate = iso => { if(!iso) return ""; const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const role = () => S.owner ? "florent" : "genevieve";
const G = () => S.noms.genevieve || "votre interlocutrice";

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ---------- Échanges avec le serveur ---------- */
async function api(payload){
  const body = new URLSearchParams({ payload: JSON.stringify(Object.assign({ code: S.code }, payload)) });
  const res = await fetch(API, { method: "POST", body });
  if(!res.ok) throw new Error("http " + res.status);
  return res.json();
}
const REFUS = { code:"Votre code n'est plus valable. Reconnectez-vous.", droits:"Cette partie est réservée à Florent.", taille:"Ce texte est trop long pour être enregistré en une fois.", requete:"La demande n'a pas été comprise." };

/* Un seul enregistrement à la fois : un double clic ne crée pas de doublon. */
async function save(col, id, data, isNew){
  if(S.busy) return false;
  S.busy = true;
  const btns = [...document.querySelectorAll("#layer button, #panel button")];
  btns.forEach(b => b.disabled = true);
  document.body.style.cursor = "progress";
  try { return await saveNow(col, id, data, isNew); }
  finally { S.busy = false; btns.forEach(b => b.disabled = false); document.body.style.cursor = ""; }
}
async function saveNow(col, id, data, isNew){
  const prev = S.data[col].find(d => d.id === id) || {};
  const doc = Object.assign({}, prev, data, { updatedAt: nowIso(), updatedBy: role() });
  if(isNew){ doc.createdAt = nowIso(); doc.createdBy = role(); }
  delete doc.id;
  try {
    const r = await api({ action:"save", col, id, data: doc });
    if(!r || !r.ok){ showErr(REFUS[r && r.err] || "L'enregistrement a été refusé."); return false; }
    S.data[col] = S.data[col].filter(d => d.id !== id).concat([Object.assign({ id }, doc)]);
    S.err = null; render();
    return true;
  } catch(e){ showErr("L'enregistrement n'a pas abouti. Vérifiez votre connexion internet et réessayez : votre texte est toujours à l'écran."); return false; }
}
async function remove(col, id){
  try {
    const r = await api({ action:"delete", col, id });
    if(r && r.ok){ S.data[col] = S.data[col].filter(d => d.id !== id); render(); }
    else showErr(REFUS[r && r.err] || "La suppression a été refusée.");
  } catch(e){ showErr("La suppression n'a pas abouti. Réessayez dans un instant."); }
}
function showErr(msg){ S.err = msg; render(); }

async function load(){
  const r = await api({ action:"load" });
  if(!r || !r.ok) return r || { ok:false };
  S.owner = r.role === "florent";
  S.client = r.client || ""; S.ref = r.ref || "";
  S.noms = Object.assign({ genevieve:"", florent:"Florent" }, r.noms || {});
  ALL.forEach(c => S.data[c] = (r.docs && r.docs[c]) || []);
  return r;
}
let pollTimer = null;
async function refresh(){
  try {
    const r = await load();
    if(!r.ok){ if(r.err === "code") logout("Votre code n'est plus valable."); return; }
    if(S.err && S.err.startsWith("Connexion")) S.err = null;
    render();
  } catch(e){ S.err = "Connexion au serveur interrompue. Ce qui n'est pas enregistré reste à l'écran ; la page réessaiera seule."; render(); }
}

/* ---------- Connexion ---------- */
function showLogin(msg){
  S.ready = false;
  ["#nav-spaces","#btn-out","#rail"].forEach(sel => $(sel).classList.add("hidden"));
  $(".shell").classList.add("solo");
  $("#brand-t").textContent = "Espace de travail";
  $("#panel").innerHTML = `<div class="card"><h1>Espace de travail</h1>
    <p class="intro">Saisissez le code personnel qui vous a été remis.</p>
    <form id="login-form" class="items" autocomplete="off">
      <div class="field"><label for="login-code">Code d'accès</label><input id="login-code" inputmode="text" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false"></div>
      <label class="row" for="login-remember" style="gap:8px"><input type="checkbox" id="login-remember" checked> Rester connecté sur cet ordinateur</label>
      ${msg ? `<div class="notice err" role="alert">${esc(msg)}</div>` : ""}
      <div class="row"><button class="btn primary" type="submit">Entrer</button></div>
    </form>
    <p class="small">Code perdu ? Demandez-le à Florent Muliva, Flowrent Build.</p></div>`;
  $("#login-form").onsubmit = e => { e.preventDefault(); const c = $("#login-code").value.trim().toUpperCase(); if(c) tryLogin(c, $("#login-remember").checked); };
  $("#login-code").focus();
}
async function tryLogin(code, remember){
  S.code = code;
  const btn = $("#login-form button"); if(btn){ btn.disabled = true; btn.textContent = "Connexion…"; }
  try {
    const r = await load();
    if(!r.ok){ S.code = null; try { localStorage.removeItem(STORE_KEY); } catch(e){} showLogin(r.err === "code" ? "Ce code n'est pas reconnu. Vérifiez-le et réessayez." : "La connexion a été refusée."); return; }
    try { if(remember) localStorage.setItem(STORE_KEY, code); else localStorage.removeItem(STORE_KEY); } catch(e){}
    enterApp();
  } catch(e){ S.code = null; showLogin("Le serveur ne répond pas. Vérifiez votre connexion internet et réessayez."); }
}
function enterApp(){
  S.ready = true; S.err = null;
  $(".shell").classList.remove("solo");
  ["#nav-spaces","#btn-out","#rail"].forEach(sel => $(sel).classList.remove("hidden"));
  $("#lnk-f").classList.toggle("hidden", !S.owner);
  $("#lnk-g").textContent = "Espace " + G();
  $("#brand-t").textContent = (S.client ? S.client + " · " : "") + "Lot 1";
  render();
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if(!document.hidden && !$("#layer").innerHTML) refresh(); }, POLL_MS);
}
function logout(msg){
  try { localStorage.removeItem(STORE_KEY); } catch(e){}
  clearInterval(pollTimer); closeSheet();
  S.code = null; S.owner = false; ALL.forEach(c => S.data[c] = []);
  showLogin(typeof msg === "string" ? msg : "");
}
function init(){
  window.addEventListener("hashchange", () => { if(S.ready) render(); });
  document.addEventListener("visibilitychange", () => { if(!document.hidden && S.ready) refresh(); });
  $("#btn-out").onclick = () => logout();
  let saved = null; try { saved = localStorage.getItem(STORE_KEY); } catch(e){}
  if(saved) tryLogin(saved, true); else showLogin("");
}

/* ---------- Rendu général ---------- */
function space(){ const h = location.hash.replace("#",""); if(h === "florent" && S.owner) return "florent"; if(h === "genevieve") return "genevieve"; return S.owner ? "florent" : "genevieve"; }

function render(){
  if(!S.ready) return;
  /* Les saisies en cours dans le panneau survivent aux mises à jour en direct. */
  const keep = {};
  document.querySelectorAll("#panel input[id], #panel textarea[id], #panel select[id]").forEach(el => keep[el.id] = el.value);
  const focused = document.activeElement && document.activeElement.closest && document.activeElement.closest("#panel") ? document.activeElement.id : null;
  draw();
  Object.entries(keep).forEach(([id, v]) => { const el = document.getElementById(id); if(el && el.closest("#panel")) el.value = v; });
  if(focused){ const el = document.getElementById(focused); if(el) el.focus(); }
}
function draw(){
  const sp = space();
  $("#lnk-g").setAttribute("aria-current", sp === "genevieve" ? "page" : "false");
  $("#lnk-f").setAttribute("aria-current", sp === "florent" ? "page" : "false");
  if(sp === "florent") renderFlorent(); else renderGenevieve();
}

function railHtml(entries, current){
  return entries.map(e => e === "-" ? '<div class="sep"></div>' :
    `<button data-sec="${e.k}" aria-current="${e.k===current}">${e.n ? `<span class="n">${e.n}</span>` : ""}<span class="lbl">${esc(e.l)}</span>${e.c!=null && e.c!=="" ? `<span class="cnt ${e.hot?"hot":""}">${e.c}</span>` : ""}</button>`).join("");
}
function bindRail(key){
  document.querySelectorAll("#rail button").forEach(b => b.onclick = () => { S[key] = b.dataset.sec; render(); window.scrollTo({top:0}); });
}
const errBox = () => S.err ? `<div class="notice err" role="alert">${esc(S.err)}</div>` : "";
const guard = () => `<div class="guard"><b>À ne jamais écrire ici :</b> les noms des salariés, leurs pointages, congés, paie ou santé, les mots de passe et les coordonnées bancaires. Désignez les personnes par leur fonction (« le chef de chantier », « le cabinet comptable »). Les fichiers restent sur le serveur de ${esc(S.client)} : indiquez seulement où ils se trouvent.</div>`;

/* ---------- Données dérivées ---------- */
const D = {
  act: () => S.data.activites.slice().sort((a,b) => (a.importance||"9").localeCompare(b.importance||"9") || String(a.titre).localeCompare(String(b.titre))),
  fiches: () => S.data.fiches.slice().sort((a,b) => String(b.updatedAt||"").localeCompare(String(a.updatedAt||""))),
  qOpen: () => S.data.questions.filter(q => q.statut === "ouverte"),
  todoG: () => S.data.fiches.filter(f => f.statut === "a_valider"),
  toWrite: () => S.data.fiches.filter(f => f.statut === "a_ecrire" || f.statut === "brouillon"),
  toReview: () => S.data.fiches.filter(f => f.statut === "a_relire"),
  siteCount: () => S.data.seances.filter(s => s.type === "site").length,
};

/* =======================================================
   ESPACE GENEVIÈVE
   ======================================================= */
function renderGenevieve(){
  const sec = S.gSec;
  $("#rail").innerHTML = railHtml([
    {k:"accueil", l:"Votre parcours"},
    {k:"activites", n:1, l:"Mes activités", c:S.data.activites.length},
    {k:"fiches", n:2, l:"Mes fiches pas à pas", c:(D.todoG().length ? D.todoG().length+" à valider" : S.data.fiches.length), hot:D.todoG().length>0},
    {k:"questions", n:3, l:"Questions de Florent", c:(D.qOpen().length || ""), hot:D.qOpen().length>0},
    {k:"accueilnew", n:4, l:"Accueillir un nouveau", c:S.data.accueil.length},
    {k:"documents", n:5, l:"Documents à déposer", c:`${S.data.documents.filter(d=>d.statut==="depose").length}/${S.data.documents.length}`},
  ], sec);
  bindRail("gSec");
  const P = $("#panel");
  const map = {accueil:gHome, activites:gActivites, fiches:gFiches, questions:gQuestions, accueilnew:gAccueil, documents:gDocuments};
  P.innerHTML = errBox() + (map[sec] || gHome)();
  bindPanel();
}

function gHome(){
  const todo = [];
  D.todoG().forEach(f => todo.push(`<div class="item"><div><div class="ttl">${esc(f.titre)}</div><div class="meta">Florent a mis cette fiche au propre. Relisez-la et validez-la, ou indiquez vos corrections.</div></div><div class="acts"><button class="btn primary small" data-open-fiche="${f.id}">Relire</button></div></div>`));
  D.qOpen().forEach(q => todo.push(`<div class="item"><div><div class="ttl">${esc(q.question)}</div><div class="meta">Question de Florent · ${esc(LIVRABLES[q.livrable]||"")}</div></div><div class="acts"><button class="btn small" data-go="questions">Répondre</button></div></div>`));
  D.toWrite().slice(0,5).forEach(f => todo.push(`<div class="item"><div><div class="ttl">${esc(f.titre)}</div><div class="meta">${f.statut==="a_ecrire" ? "Fiche à écrire" : "Brouillon en cours"}</div></div><div class="acts"><button class="btn small" data-open-fiche="${f.id}">Écrire</button></div></div>`));
  const today = new Date().toISOString().slice(0,10);
  const next = S.data.seances.filter(s => (s.date||"") >= today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);
  return `
  <div class="card"><h1>Bonjour ${esc(G())}</h1>
    <p class="intro">Cet espace sert à mettre par écrit ce que vous faites, à votre rythme. Quinze minutes suffisent : une activité ou une fiche à la fois. Florent relit, met en forme, et vous validez chaque version. Rien n'est diffusé sans votre accord.</p></div>
  <div class="card"><h2>Votre prochain pas</h2>
    ${todo.length ? `<div class="items">${todo.join("")}</div>` : `<div class="empty">Rien en attente. Vous pouvez compléter la liste de vos activités (étape 1).</div>`}</div>
  <div class="card"><h2>Le parcours en cinq étapes</h2>
    <div class="items">
      <div class="item"><div><div class="ttl">1. Mes activités</div><div class="meta">La liste de tout ce que vous faites, avec la fréquence et qui d'autre sait le faire.</div></div><div class="acts"><button class="btn small" data-go="activites">Ouvrir</button></div></div>
      <div class="item"><div><div class="ttl">2. Mes fiches pas à pas</div><div class="meta">Pour les tâches importantes : les étapes, les cas particuliers, les pièges.</div></div><div class="acts"><button class="btn small" data-go="fiches">Ouvrir</button></div></div>
      <div class="item"><div><div class="ttl">3. Questions de Florent</div><div class="meta">Il vous pose ici ses questions entre deux séances.</div></div><div class="acts"><button class="btn small" data-go="questions">Ouvrir</button></div></div>
      <div class="item"><div><div class="ttl">4. Accueillir un nouveau</div><div class="meta">Ce qu'un nouvel arrivant vous demande toujours, et ce qu'il doit savoir la première semaine.</div></div><div class="acts"><button class="btn small" data-go="accueilnew">Ouvrir</button></div></div>
      <div class="item"><div><div class="ttl">5. Documents à déposer</div><div class="meta">Les fichiers utiles à déposer sur le serveur de ${esc(S.client)}.</div></div><div class="acts"><button class="btn small" data-go="documents">Ouvrir</button></div></div>
    </div></div>
  <div class="card"><h2>Prochaines séances avec Florent</h2>
    ${next.length ? `<div class="items">${next.map(s=>`<div class="item"><div><div class="ttl">${fmtDate(s.date)} · ${s.type==="site"?"Sur site":"En visio"}</div><div class="meta">${esc(s.objet||"")}</div></div></div>`).join("")}</div>` : `<div class="empty">Aucune séance planifiée pour l'instant.</div>`}</div>
  ${guard()}`;
}

function gActivites(){
  const acts = D.act();
  const groups = {};
  acts.forEach(a => { const k = a.domaine || "Autre"; (groups[k] = groups[k] || []).push(a); });
  const body = acts.length ? Object.keys(groups).map(g => `<div class="group-h">${esc(g)}</div>` + groups[g].map(actItem).join("")).join("") : `<div class="empty">Aucune activité pour l'instant. Commencez par ce que vous faites chaque semaine.</div>`;
  return `
  <div class="card"><div class="row spread"><h1>1. Mes activités</h1><button class="btn primary" data-new-act>Ajouter une activité</button></div>
    <p class="intro">Notez tout ce que vous faites, même ce qui vous paraît évident. Une ligne par activité. Pensez aussi à ce qui n'est écrit dans aucune fiche de poste.</p></div>
  <div class="items">${body}</div>
  ${guard()}`;
}
function actItem(a){
  const fiche = S.data.fiches.find(f => f.activiteId === a.id);
  return `<div class="item"><div><div class="ttl">${esc(a.titre)}</div>
    <div class="meta">${esc(a.frequence||"")}${a.quand?` · ${esc(a.quand)}`:""}${a.outils?` · ${esc(a.outils)}`:""}</div>
    <div class="row" style="margin-top:4px">${a.importance?`<span class="pill imp-${esc(a.importance)}">${esc(IMP[a.importance]||"")}</span>`:""}${a.quiSait?`<span class="pill st-brouillon">${esc(a.quiSait)}</span>`:""}${fiche?`<span class="pill st-${esc(fiche.statut)}">Fiche : ${esc(ST[fiche.statut]||"")}</span>`:""}</div></div>
    <div class="acts"><button class="btn small" data-edit-act="${a.id}">Modifier</button>${S.owner && !fiche ? `<button class="btn small" data-mkfiche="${a.id}">Créer la fiche</button>`:""}</div></div>`;
}

function gFiches(){
  const order = ["a_valider","a_ecrire","brouillon","a_relire","validee"];
  const fs = D.fiches().sort((a,b) => order.indexOf(a.statut) - order.indexOf(b.statut));
  return `
  <div class="card"><div class="row spread"><h1>2. Mes fiches pas à pas</h1><button class="btn primary" data-new-fiche>Nouvelle fiche</button></div>
    <p class="intro">Une fiche décrit une tâche comme vous l'expliqueriez à quelqu'un qui vous remplace. Écrivez avec vos mots, sans souci de présentation : Florent met en forme, puis vous validez.</p></div>
  <div class="items">${fs.length ? fs.map(ficheItem).join("") : `<div class="empty">Aucune fiche pour l'instant.</div>`}</div>
  ${guard()}`;
}
function ficheItem(f){
  const btn = f.statut === "a_valider" ? `<button class="btn primary small" data-open-fiche="${f.id}">Relire et valider</button>` : `<button class="btn small" data-open-fiche="${f.id}">${f.statut==="validee"||f.statut==="a_relire"?"Voir":"Écrire"}</button>`;
  return `<div class="item"><div><div class="ttl">${esc(f.titre)}</div><div class="meta">${esc(PARTIES[f.partie]||"")}${f.partie==="affaires"&&f.etape?` · ${esc(f.etape)}`:""} · mise à jour le ${fmtDate(f.updatedAt)}</div>
    <div class="row" style="margin-top:4px"><span class="pill st-${esc(f.statut)}">${esc(ST[f.statut]||"")}</span></div></div><div class="acts">${btn}</div></div>`;
}

function gQuestions(){
  const qs = S.data.questions.slice().sort((a,b) => (a.statut==="ouverte"?0:1)-(b.statut==="ouverte"?0:1) || String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  return `
  <div class="card"><h1>3. Questions de Florent</h1><p class="intro">Entre deux séances, Florent vous pose ici les questions qui lui manquent pour finir une fiche. Répondez quand vous avez un moment, même en quelques mots.</p></div>
  <div class="items">${qs.length ? qs.map(q => `
    <div class="item" style="grid-template-columns:1fr"><div><div class="ttl">${esc(q.question)}</div><div class="meta">${esc(LIVRABLES[q.livrable]||"")} · posée le ${fmtDate(q.createdAt)}</div></div>
    ${q.statut==="ouverte" ? `<div class="field"><label for="rep-${q.id}">Votre réponse</label><textarea id="rep-${q.id}">${esc(q.reponse||"")}</textarea><div class="row"><button class="btn primary small" data-answer="${q.id}">Envoyer ma réponse</button></div></div>`
      : `<div class="ro">${nl(q.reponse||"")}</div>`}</div>`).join("") : `<div class="empty">Aucune question pour l'instant.</div>`}</div>
  ${guard()}`;
}

function gAccueil(){
  const qs = S.data.accueil.filter(a => a.type === "question");
  const ks = S.data.accueil.filter(a => a.type === "a_savoir");
  const li = a => `<div class="item"><div><div class="ttl">${esc(a.texte)}</div>${a.reponse?`<div class="meta">${nl(a.reponse)}</div>`:""}</div><div class="acts"><button class="btn small" data-edit-acc="${a.id}">Modifier</button></div></div>`;
  return `
  <div class="card"><h1>4. Accueillir un nouveau</h1><p class="intro">Ces réponses formeront le livret d'accueil des nouveaux collaborateurs. Pensez à la dernière personne arrivée : qu'a-t-elle dû vous redemander ?</p></div>
  <div class="card"><div class="row spread"><h2>Les questions qu'un nouveau vous pose toujours</h2><button class="btn small" data-new-acc="question">Ajouter</button></div>
    <div class="items">${qs.length ? qs.map(li).join("") : `<div class="empty">Ex. « Où je pose mes congés ? », « À qui je donne mes notes de frais ? »</div>`}</div></div>
  <div class="card"><div class="row spread"><h2>Ce qu'il faut savoir dès la première semaine</h2><button class="btn small" data-new-acc="a_savoir">Ajouter</button></div>
    <div class="items">${ks.length ? ks.map(li).join("") : `<div class="empty">Ex. horaires, règles de sécurité à connaître, où trouver les modèles de documents.</div>`}</div></div>
  ${guard()}`;
}

function gDocuments(){
  const ds = S.data.documents.slice().sort((a,b) => (a.statut==="depose"?1:0)-(b.statut==="depose"?1:0));
  return `
  <div class="card"><div class="row spread"><h1>5. Documents à déposer</h1><button class="btn small" data-new-doc>Ajouter un document</button></div>
    <p class="intro">Ces fichiers ne s'envoient pas ici : déposez-les dans le dossier convenu sur le serveur de ${esc(S.client)}, puis cochez-les en indiquant où ils se trouvent.</p></div>
  <div class="items">${ds.length ? ds.map(d => `<div class="item"><div><div class="ttl">${esc(d.nom)}</div><div class="meta">${esc(d.utilite||"")}${d.emplacement?` · ${esc(d.emplacement)}`:""}</div>
    <div class="row" style="margin-top:4px"><span class="pill ${d.statut==="depose"?"st-validee":"st-a_ecrire"}">${d.statut==="depose"?"Déposé":"À déposer"}</span></div></div>
    <div class="acts"><button class="btn small" data-edit-doc="${d.id}">${d.statut==="depose"?"Modifier":"Marquer déposé"}</button></div></div>`).join("") : `<div class="empty">Aucun document demandé pour l'instant.</div>`}</div>`;
}

/* =======================================================
   ESPACE FLORENT
   ======================================================= */
function renderFlorent(){
  const sec = S.fSec;
  const answered = S.data.questions.filter(q => q.statut === "repondue").length;
  $("#rail").innerHTML = railHtml([
    {k:"bord", l:"Tableau de bord"},
    {k:"relecture", l:"Fiches à relire", c:(D.toReview().length||""), hot:D.toReview().length>0},
    {k:"activites", l:"Carte du poste", c:S.data.activites.length},
    {k:"questions", l:"Questions", c:(answered ? answered+" réponses" : D.qOpen().length||""), hot:answered>0},
    {k:"seances", l:"Séances", c:`${D.siteCount()}/${MAX_SITE} sur site`},
    {k:"nomenclature", l:"Correspondance B21", c:S.data.nomenclature.length},
    "-",
    {k:"prive", l:"Notes privées", c:S.data.prive.length||""},
    {k:"export", l:"Export des livrables"},
  ], sec);
  bindRail("fSec");
  const map = {bord:fBord, relecture:fRelecture, activites:fActivites, questions:fQuestions, seances:fSeances, nomenclature:fNomenclature, prive:fPrive, export:fExport};
  $("#panel").innerHTML = errBox() + (map[sec] || fBord)();
  bindPanel();
}

function tile(code, title, big, sub, pct, warn){
  return `<div class="tile"><div class="code">${esc(code)}</div><div style="font-weight:700">${esc(title)}</div><div class="big">${big}</div><div class="sub">${sub}</div>${pct!=null?`<div class="bar ${warn?"warn":""}"><span style="width:${Math.min(100,Math.round(pct))}%"></span></div>`:""}</div>`;
}
function fBord(){
  const f = S.data.fiches;
  const by = p => f.filter(x => x.partie === p);
  const val = arr => arr.filter(x => x.statut === "validee").length;
  const actAd = S.data.activites.length;
  const etapesCouvertes = new Set(by("affaires").map(x => x.etape).filter(Boolean)).size;
  const site = D.siteCount();
  const solo = S.data.activites.filter(a => a.quiSait === "Personne d'autre" && a.importance === "1");
  return `
  <div class="card"><h1>Tableau de bord du lot 1</h1><p class="intro">Avancement par livrable du bon de commande ${esc(S.ref)}. Une fiche compte quand ${esc(G())} l'a validée.</p></div>
  <div class="tiles">
    ${tile("B01","Guide du poste d'assistante de direction", `${val(by("poste_ad"))}/${by("poste_ad").length}`, `fiches validées · ${actAd} activités recensées`, by("poste_ad").length ? val(by("poste_ad"))/by("poste_ad").length*100 : 0)}
    ${tile("B03","Procédures de gestion d'affaires", `${val(by("affaires"))}/${by("affaires").length}`, `fiches validées · étapes couvertes ${etapesCouvertes}/${ETAPES.length}`, etapesCouvertes/ETAPES.length*100)}
    ${tile("B04","Livret d'accueil", S.data.accueil.length, "questions et repères recueillis", null)}
    ${tile("B21","Correspondance des nomenclatures", S.data.nomenclature.length, "lignes de correspondance", null)}
    ${tile("Site","Demi-journées sur site", `${site}/${MAX_SITE}`, site >= MAX_SITE ? "plafond atteint" : `${MAX_SITE-site} restantes`, site/MAX_SITE*100, site >= MAX_SITE-1)}
  </div>
  <div class="card"><h2>À traiter</h2><div class="items">
    ${D.toReview().map(x => `<div class="item"><div><div class="ttl">${esc(x.titre)}</div><div class="meta">Envoyée le ${fmtDate(x.updatedAt)}</div></div><div class="acts"><button class="btn primary small" data-review="${x.id}">Relire</button></div></div>`).join("")}
    ${S.data.questions.filter(q=>q.statut==="repondue").map(q => `<div class="item"><div><div class="ttl">${esc(q.question)}</div><div class="meta">Réponse reçue</div></div><div class="acts"><button class="btn small" data-fgo="questions">Lire</button></div></div>`).join("")}
    ${!D.toReview().length && !S.data.questions.some(q=>q.statut==="repondue") ? `<div class="empty">Rien en attente de votre côté.</div>` : ""}
  </div></div>
  <div class="card"><h2>Savoirs détenus par elle seule</h2><p class="intro">Activités essentielles que personne d'autre ne sait faire : à documenter en premier.</p>
    <div class="items">${solo.length ? solo.map(actItem).join("") : `<div class="empty">Aucune pour l'instant, ou la carte du poste n'est pas encore remplie.</div>`}</div></div>`;
}

function fRelecture(){
  const fs = D.fiches();
  const order = ["a_relire","a_valider","brouillon","a_ecrire","validee"];
  fs.sort((a,b) => order.indexOf(a.statut) - order.indexOf(b.statut));
  return `<div class="card"><div class="row spread"><h1>Fiches</h1><button class="btn primary" data-new-fiche>Créer une fiche à écrire</button></div>
    <p class="intro">Relisez ce qu'elle a écrit, rédigez la version mise au propre, puis envoyez-la-lui pour validation.</p></div>
    <div class="items">${fs.length ? fs.map(f => `<div class="item"><div><div class="ttl">${esc(f.titre)}</div><div class="meta">${esc(PARTIES[f.partie]||"")}${f.etape?` · ${esc(f.etape)}`:""} · ${fmtDate(f.updatedAt)}</div><div class="row" style="margin-top:4px"><span class="pill st-${esc(f.statut)}">${esc(ST[f.statut]||"")}</span></div></div><div class="acts"><button class="btn ${f.statut==="a_relire"?"primary":""} small" data-review="${f.id}">Ouvrir</button></div></div>`).join("") : `<div class="empty">Aucune fiche.</div>`}</div>`;
}

function fActivites(){
  const acts = D.act();
  return `<div class="card"><div class="row spread"><h1>Carte du poste</h1><button class="btn" data-new-act>Ajouter une activité</button></div>
    <p class="intro">Toutes les activités recensées, classées par importance. « Créer la fiche » ajoute la tâche dans sa liste « à écrire ».</p></div>
    <div class="card tbl-wrap"><table><thead><tr><th>Activité</th><th>Domaine</th><th>Fréquence</th><th>Qui d'autre sait</th><th>Importance</th><th>Fiche</th><th></th></tr></thead><tbody>
    ${acts.length ? acts.map(a => { const fi = S.data.fiches.find(f=>f.activiteId===a.id); return `<tr><td><b>${esc(a.titre)}</b>${a.siAbsente?`<div class="meta" style="color:var(--muted);font-size:.85rem">Si absente : ${esc(a.siAbsente)}</div>`:""}</td><td>${esc(a.domaine||"")}</td><td>${esc(a.frequence||"")}${a.quand?`<br><span style="color:var(--muted)">${esc(a.quand)}</span>`:""}</td><td>${esc(a.quiSait||"")}</td><td>${a.importance?`<span class="pill imp-${esc(a.importance)}">${esc(IMP[a.importance])}</span>`:""}</td><td>${fi?`<span class="pill st-${esc(fi.statut)}">${esc(ST[fi.statut])}</span>`:""}</td><td style="white-space:nowrap"><button class="btn small" data-edit-act="${a.id}">Modifier</button> ${fi?"":`<button class="btn small" data-mkfiche="${a.id}">Créer la fiche</button>`}</td></tr>`; }).join("") : `<tr><td colspan="7"><div class="empty">Aucune activité recensée.</div></td></tr>`}
    </tbody></table></div>`;
}

function fQuestions(){
  const qs = S.data.questions.slice().sort((a,b) => String(b.createdAt||"").localeCompare(String(a.createdAt||"")));
  return `<div class="card"><h1>Questions à ${esc(G())}</h1><p class="intro">Ce qui manque pour terminer une fiche, sans attendre la prochaine séance.</p>
    <div class="field"><label for="q-new">Nouvelle question</label><textarea id="q-new" style="min-height:70px"></textarea></div>
    <div class="row"><div class="field" style="flex:1;min-width:220px"><label for="q-liv">Livrable concerné</label><select id="q-liv">${Object.entries(LIVRABLES).map(([k,v])=>`<option value="${k}">${k==="AUTRE"?"":k+" · "}${esc(v)}</option>`).join("")}</select></div><button class="btn primary" data-ask style="align-self:flex-end">Poser la question</button></div></div>
    <div class="items">${qs.map(q => `<div class="item"><div><div class="ttl">${esc(q.question)}</div><div class="meta">${esc(LIVRABLES[q.livrable]||"")} · ${q.statut==="ouverte"?"en attente de réponse":q.statut==="repondue"?"réponse reçue":"close"}</div>${q.reponse?`<div class="ro" style="margin-top:6px">${nl(q.reponse)}</div>`:""}</div>
      <div class="acts">${q.statut==="repondue"?`<button class="btn small" data-closeq="${q.id}">Marquer traitée</button>`:""}<button class="btn small ghost" data-delq="${q.id}">Supprimer</button></div></div>`).join("") || `<div class="empty">Aucune question posée.</div>`}</div>`;
}

function fSeances(){
  const ss = S.data.seances.slice().sort((a,b) => String(a.date).localeCompare(String(b.date)));
  const site = D.siteCount();
  return `<div class="card"><div class="row spread"><h1>Séances</h1><button class="btn primary" data-new-seance>Ajouter une séance</button></div>
    <p class="intro">Le bon de commande prévoit six demi-journées sur site au maximum. Les séances en visio ne sont pas plafonnées. ${site}/${MAX_SITE} utilisées.</p>
    <div class="bar ${site>=MAX_SITE-1?"warn":""}"><span style="width:${Math.min(100,site/MAX_SITE*100)}%"></span></div></div>

/* ---------- Export Markdown des livrables ---------- */
function ficheMd(f){
  if(f.miseEnForme) return `### ${f.titre}\n\n${f.miseEnForme}\n`;
  const parts = [`### ${f.titre}`, f.statut!=="validee"?`_Statut : ${ST[f.statut]||""}_`:""];
  const add = (t,v) => { if(v) parts.push(`**${t}**\n\n${v}`); };
  add("Quand le faire", f.declencheur);
  if(f.etapes) parts.push("**Étapes**\n\n" + f.etapes.split("\n").filter(Boolean).map((l,i)=>`${i+1}. ${l.replace(/^\d+[.)]\s*/,"")}`).join("\n"));
  add("Outils et fichiers", f.outils); add("Cas particuliers", f.cas); add("Erreurs à éviter", f.pieges); add("Contrôle", f.controle); add("Qui valide, à qui s'adresser", f.contact);
  return parts.filter(Boolean).join("\n\n") + "\n";
}
function buildExport(){
  const out = [];
  const acts = D.act();
  const fiches = S.data.fiches;
  const posteBlock = (poste, partie, titre) => {
    out.push(`# ${titre}\n`);
    const as = acts;
    out.push(`## Les missions, par domaine\n`);
    const g = {}; as.forEach(a => (g[a.domaine||"Autre"] = g[a.domaine||"Autre"] || []).push(a));
    Object.keys(g).forEach(k => { out.push(`### ${k}\n`); g[k].forEach(a => out.push(`- ${a.titre}${a.frequence?` (${a.frequence.toLowerCase()}${a.quand?`, ${a.quand}`:""})`:""}${a.outils?`. Outils : ${a.outils}`:""}`)); out.push(""); });
    out.push(`## Le calendrier des tâches\n`);
    FREQ.forEach(fq => { const l = as.filter(a=>a.frequence===fq); if(l.length){ out.push(`### ${fq}\n`); l.forEach(a=>out.push(`- ${a.titre}${a.quand?` (${a.quand})`:""}`)); out.push(""); } });
    const vig = as.filter(a => a.quiSait === "Personne d'autre" || a.siAbsente);
    if(vig.length){ out.push(`## Points de vigilance\n`); vig.forEach(a => out.push(`- **${a.titre}**${a.quiSait?` : ${a.quiSait.toLowerCase()} ne sait le faire`:""}${a.siAbsente?`. En cas d'absence : ${a.siAbsente}`:""}`)); out.push(""); }
    out.push(`## Les procédures\n`);
    fiches.filter(f=>f.partie===partie).forEach(f => out.push(ficheMd(f)));
  };
  posteBlock("ad","poste_ad","Guide du poste d'assistante de direction");
  out.push(`# Procédures de gestion d'affaires, du devis à la clôture\n`);
  ETAPES.forEach(e => { const l = fiches.filter(f=>f.partie==="affaires" && f.etape===e); if(l.length){ out.push(`## ${e}\n`); l.forEach(f=>out.push(ficheMd(f))); } });
  const sansEtape = fiches.filter(f=>f.partie==="affaires" && !f.etape); if(sansEtape.length){ out.push(`## Autres\n`); sansEtape.forEach(f=>out.push(ficheMd(f))); }
  out.push(`# Livret d'accueil des nouveaux collaborateurs\n`);
  out.push(`## Les questions qu'on pose toujours\n`); S.data.accueil.filter(a=>a.type==="question").forEach(a=>out.push(`**${a.texte}**\n\n${a.reponse||""}\n`));
  out.push(`## Ce qu'il faut savoir dès la première semaine\n`); S.data.accueil.filter(a=>a.type==="a_savoir").forEach(a=>out.push(`- **${a.texte}**${a.reponse?` : ${a.reponse}`:""}`));
  out.push(`\n# Correspondance des nomenclatures\n\n| Code | Intitulé | Dossier sur le serveur | Remarque |\n|---|---|---|---|`);
  S.data.nomenclature.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code),"fr",{numeric:true})).forEach(n=>out.push(`| ${n.code} | ${n.libelle} | ${n.chemin} | ${n.remarque||""} |`));
  return out.join("\n");
}
function fExport(){
  const md = buildExport();
  return `<div class="card"><h1>Export des livrables</h1><p class="intro">Les livrables du lot 1 assemblés à partir de l'espace, en Markdown (format ouvert), prêts à déposer sur le serveur de ${esc(S.client)}. Les fiches mises au propre reprennent votre version ; les autres, les notes brutes de Geneviève avec leur statut.</p>
    <div class="row"><button class="btn primary" data-copy>Copier</button><button class="btn" data-download>Télécharger le fichier .md</button></div></div>
    <pre class="md" id="md-out">${esc(md)}</pre>`;
}

/* ---------- Dictée (Florent) ---------- */
function micBtn(target){ return S.dict ? `<button type="button" class="mic" data-mic="${target}" data-on="0">Dicter</button>` : ""; }
let micTargetId = null, micState = "idle";
function setupDictation(){
  const d = S.dict; if(!d) return;
  d.onFinal(({text}) => { const t = micTargetId && document.getElementById(micTargetId); if(t && text){ t.value = (t.value ? t.value.replace(/\s*$/, " ") : "") + text; } });
  d.onState(({state}) => { micState = state; document.querySelectorAll("[data-mic]").forEach(x => { const on = state === "listening" && x.dataset.mic === micTargetId; x.dataset.on = on ? "1" : "0"; x.textContent = on ? "Arrêter la dictée" : "Dicter"; }); });
}
function bindMic(root){
  root.querySelectorAll("[data-mic]").forEach(b => b.onclick = () => {
    const d = S.dict; if(!d) return;
    if(b.dataset.on === "1"){ d.stop().catch(() => {}); return; }
    micTargetId = b.dataset.mic;
    d.start().catch(e => { if(e && e.code === "not_granted"){ S.dict = null; document.querySelectorAll("[data-mic]").forEach(x => x.remove()); } });
  });
}

function openSheet(html, onMount){
  const L = $("#layer");
  L.innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">${html}</div></div>`;
  const ov = $(".overlay", L);
  ov.addEventListener("click", e => { if(e.target === ov) closeSheet(); });
  document.addEventListener("keydown", escClose);
  onMount && onMount($(".sheet", L));
  bindMic(L);
  const first = L.querySelector("input,select,textarea"); first && first.focus();
}

    if(id && d.statut !== "depose") sh.querySelector("#d-st").value = "depose";
    sh.querySelector("[data-cancel]").onclick = closeSheet;
    const del = sh.querySelector("[data-del]"); if(del) del.onclick = async () => { if(del.dataset.c){ await remove("documents", id); closeSheet(); } else { del.dataset.c="1"; del.textContent="Confirmer la suppression"; } };
    sh.querySelector("[data-ok]").onclick = async () => { const n = val("d-nom"); if(!n){ toast("Nom du document manquant."); return; } if(await save("documents", id || newId(), {nom:n, utilite:val("d-ut"), emplacement:val("d-emp"), statut:val("d-st")}, !id)){ closeSheet(); toast("Enregistré"); } };
  });
}

function editSeance(id){
  const s = S.data.seances.find(x => x.id === id) || {type:"site", date:new Date().toISOString().slice(0,10)};
  openSheet(`<h2>${id ? "Modifier la séance" : "Nouvelle séance"}</h2>
    <div class="two">${fld("s-date","Date","",`<input type="date" id="s-date" value="${esc(s.date)}">`)}
    ${fld("s-type","Type","",`<select id="s-type"><option value="site"${s.type==="site"?" selected":""}>Demi-journée sur site</option><option value="visio"${s.type==="visio"?" selected":""}>Visio</option></select>`)}</div>
    ${fld("s-obj","Objet","",`<input id="s-obj" value="${esc(s.objet)}">`)}
    ${fld("s-notes","Notes de séance","Visibles dans son espace : rien de personnel ici.",ta("s-notes", s.notes, true))}
    ${fld("s-suite","Suite convenue","",`<input id="s-suite" value="${esc(s.suite)}">`)}
    <div class="row spread"><div>${id?`<button class="btn ghost" data-del>Supprimer</button>`:""}</div><div class="row"><button class="btn" data-cancel>Annuler</button><button class="btn primary" data-ok>Enregistrer</button></div></div>`,
  sh => {
    sh.querySelector("[data-cancel]").onclick = closeSheet;
    const del = sh.querySelector("[data-del]"); if(del) del.onclick = async () => { if(del.dataset.c){ await remove("seances", id); closeSheet(); } else { del.dataset.c="1"; del.textContent="Confirmer la suppression"; } };
    sh.querySelector("[data-ok]").onclick = async () => { const dt = val("s-date"); if(!dt){ toast("Date manquante."); return; } if(await save("seances", id || newId(), {date:dt, type:val("s-type"), objet:val("s-obj"), notes:val("s-notes"), suite:val("s-suite")}, !id)){ closeSheet(); toast("Séance enregistrée"); } };
  });
}

function editNom(id){
  const n = S.data.nomenclature.find(x => x.id === id) || {};
  openSheet(`<h2>${id ? "Modifier la correspondance" : "Nouvelle correspondance"}</h2>
    <div class="two">${fld("n-code","Code de la note d'organisation","Ex. 500",`<input id="n-code" value="${esc(n.code)}">`)}
    ${fld("n-lib","Intitulé","",`<input id="n-lib" value="${esc(n.libelle)}">`)}</div>
    ${fld("n-ch","Dossier sur le serveur","Ex. 05_AFFAIRES/…",`<input id="n-ch" value="${esc(n.chemin)}">`)}
    ${fld("n-rq","Remarque","",`<input id="n-rq" value="${esc(n.remarque)}">`)}
    <div class="row spread"><div>${id?`<button class="btn ghost" data-del>Supprimer</button>`:""}</div><div class="row"><button class="btn" data-cancel>Annuler</button><button class="btn primary" data-ok>Enregistrer</button></div></div>`,
  sh => {
    sh.querySelector("[data-cancel]").onclick = closeSheet;
    const del = sh.querySelector("[data-del]"); if(del) del.onclick = async () => { if(del.dataset.c){ await remove("nomenclature", id); closeSheet(); } else { del.dataset.c="1"; del.textContent="Confirmer la suppression"; } };
    sh.querySelector("[data-ok]").onclick = async () => { const c = val("n-code"); if(!c){ toast("Code manquant."); return; } if(await save("nomenclature", id || newId(), {code:c, libelle:val("n-lib"), chemin:val("n-ch"), remarque:val("n-rq")}, !id)){ closeSheet(); toast("Enregistré"); } };
  });
}

/* ---------- Liaisons des boutons du panneau ---------- */
function bindPanel(){
  const P = $("#panel");
  const on = (sel, fn) => P.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el));
  on("[data-go]", el => { S.gSec = el.dataset.go; render(); });
  on("[data-fgo]", el => { S.fSec = el.dataset.fgo; render(); });
  on("[data-new-act]", () => editActivite(null));
  on("[data-edit-act]", el => editActivite(el.dataset.editAct));
  on("[data-mkfiche]", async el => { const a = S.data.activites.find(x => x.id === el.dataset.mkfiche); if(!a) return; if(await save("fiches", newId(), {titre:a.titre, partie:"poste_ad", etape:"", activiteId:a.id, statut:"a_ecrire"}, true)) toast("Fiche ajoutée à sa liste"); });
  on("[data-new-fiche]", () => S.owner && space()==="florent" ? openFicheF(null) : openFicheG(null));
  on("[data-open-fiche]", el => openFicheG(el.dataset.openFiche));
  on("[data-review]", el => openFicheF(el.dataset.review));
  on("[data-answer]", async el => { const id = el.dataset.answer; const r = val("rep-"+id); if(!r){ toast("Votre réponse est vide."); return; } if(await save("questions", id, {reponse:r, statut:"repondue", reponduLe:nowIso()}, false)) toast("Réponse envoyée à Florent"); });
  on("[data-new-acc]", el => editAccueil(null, el.dataset.newAcc));
  on("[data-edit-acc]", el => editAccueil(el.dataset.editAcc));
  on("[data-new-doc]", () => editDocument(null));
  on("[data-edit-doc]", el => editDocument(el.dataset.editDoc));
  on("[data-ask]", async () => { const q = val("q-new"); if(!q){ toast("La question est vide."); return; } if(await save("questions", newId(), {question:q, livrable:val("q-liv"), statut:"ouverte"}, true)){ const el = document.getElementById("q-new"); if(el) el.value = ""; toast("Question posée"); } });
  on("[data-closeq]", async el => { await save("questions", el.dataset.closeq, {statut:"close"}, false); });
  on("[data-delq]", async el => { if(el.dataset.c){ await remove("questions", el.dataset.delq); } else { el.dataset.c="1"; el.textContent="Confirmer"; } });
  on("[data-new-seance]", () => editSeance(null));
  on("[data-edit-seance]", el => editSeance(el.dataset.editSeance));
  on("[data-new-nom]", () => editNom(null));
  on("[data-edit-nom]", el => editNom(el.dataset.editNom));
  on("[data-addp]", async () => { const t = val("p-new"); if(!t) return; if(await save("prive", newId(), {texte:t}, true)){ const el = document.getElementById("p-new"); if(el) el.value = ""; toast("Note enregistrée"); } });
  on("[data-delp]", async el => { if(el.dataset.c){ await remove("prive", el.dataset.delp); } else { el.dataset.c="1"; el.textContent="Confirmer"; } });
  on("[data-copy]", async () => { try { await navigator.clipboard.writeText(buildExport()); toast("Copié"); } catch(e){ toast("Copie refusée : sélectionnez le texte ci-dessous."); } });
  on("[data-download]", () => { const blob = new Blob([buildExport()], {type:"text/markdown;charset=utf-8"}); const u = URL.createObjectURL(blob); const lk = document.createElement("a"); lk.href = u; lk.download = `${S.client || "Client"}_Lot1_livrables_${new Date().toISOString().slice(0,10)}.md`; document.body.appendChild(lk); lk.click(); lk.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); });
  bindMic(P);
}

init();
})();
</script>
</body>
</html>
